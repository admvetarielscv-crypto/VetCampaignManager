# VetCampaignManager — local orchestration.
# The frontend is the only service defined here. n8n + Evolution API run in
# the clinic's own Docker stack; this compose can extend to include them for
# all-in-one local development by uncommenting the n8n service below.

services:
  frontend:
    build: .
    image: vetcampaign:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    # Pass env vars at runtime (override .env at build time if needed).
    env_file:
      - .env
    # Healthcheck: nginx serves a 200 on the SPA root.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ── Optional: n8n for local all-in-one dev ──────────────────────────────────
  # Uncomment to run n8n alongside the frontend. Configure your workflow to
  # listen on /webhook/campaign and forward to Evolution API.
